name: Deploy assets to R2

on:
  push:
    branches:
      - main
    paths:
      - "images/**"
      - "documents/**"
      - "animations/**"
      - "data/**"
      - "!images/README.md"
      - "!images/**/README.md"
      - "!documents/README.md"
      - "!documents/**/README.md"
      - "!animations/README.md"
      - "!animations/**/README.md"
      - "!data/README.md"
      - "!data/**/README.md"
  workflow_dispatch:
    inputs:
      asset_path:
        description: "What to upload. Use /images/.../file.svg for one file or /images/.../* for a folder."
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-assets-to-r2
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync reviewed assets
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      ASSET_FORMAT_RULES: "images=svg,webp documents=pdf animations=mp4,webm,mov data=json"
      ASSET_PATH: ${{ github.event.inputs.asset_path || '' }}
      ASSET_ROOTS: "images documents animations data"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Upload assets to R2
        shell: bash
        run: scripts/deploy-assets-to-r2.sh
